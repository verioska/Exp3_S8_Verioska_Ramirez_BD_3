spring.application.name=bank-account-service
spring.config.import=optional:configserver:http://localhost:8888

server.port=8081
server.ssl.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/bankxyz/protocol/openid-connect/certs

bank.resilience.force-legacy-audit-failure=false

bank.events.kafka.enabled=false
bank.events.kafka.topic=bank-account-events
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

resilience4j.circuitbreaker.instances.legacyAudit.sliding-window-size=4
resilience4j.circuitbreaker.instances.legacyAudit.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.legacyAudit.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.legacyAudit.wait-duration-in-open-state=10s

management.endpoints.web.exposure.include=health,info,circuitbreakers
